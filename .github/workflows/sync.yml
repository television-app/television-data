name: Sync & Encrypt Playlist Data

on:
  schedule:
    # Run every 15 minutes automatically
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install requests pycryptodome

      - name: Step 1 - Refresh Toffee Live Tokens in Turso DB
        continue-on-error: true
        env:
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: |
          node sync_toffee.mjs

      - name: Step 2 - Encrypt & Generate playlist.json
        env:
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          python sync_data.py

      - name: Step 3 - Deploy to Cloudflare KV
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9078c953f7422123122e0d22ee1b159a
        run: |
          npx wrangler kv key put --remote --namespace-id 7d8c7fcfee7b4c98b8e041de879abbb8 "playlist.json" --path "playlist.json" || true

      - name: Step 4 - Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch origin main
          git reset --soft origin/main
          git add sync_toffee.mjs playlist.json vod.json
          git diff-index --quiet HEAD || git commit -m "Auto-sync encrypted channels with fresh Toffee tokens [skip ci]"
          git push origin main || (git pull --rebase -X theirs origin main && git push origin main)
