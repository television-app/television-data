name: Sync & Encrypt Playlist Data

on:
  schedule:
    # Run every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [playlist_sync, update_playlist, sync, sync_data, webhook, trigger, default]


permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pycryptodome

      - name: Run sync script
        run: |
          python sync_data.py

      - name: Deploy to Cloudflare KV
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9078c953f7422123122e0d22ee1b159a
        run: |
          npx wrangler kv key put --remote --namespace-id 7d8c7fcfee7b4c98b8e041de879abbb8 "playlist.json" --path "playlist.json" || true

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add playlist.json vod.json
          git diff-index --quiet HEAD || git commit -m "Auto-sync encrypted channels data [skip ci]"
          git push

