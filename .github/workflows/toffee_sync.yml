name: Auto Sync Toffee Tokens (Public Unlimited)

on:
  schedule:
    # Run every 15 minutes reliably on Public Repo (100% UNLIMITED minutes)
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'sync_toffee.mjs'
      - '.github/workflows/toffee_sync.yml'

permissions:
  contents: write

jobs:
  sync-toffee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install requests pycryptodome

      - name: Step 1 - Sync Latest Toffee Tokens to Turso DB
        run: node sync_toffee.mjs

      - name: Step 2 - Encrypt & Generate playlist.json for App
        run: python sync_data.py

      - name: Step 3 - Commit and Push Updated playlist.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add playlist.json
          git diff-index --quiet HEAD || git commit -m "Auto-sync refreshed Toffee tokens [skip ci]"
          git push origin main || (git pull --rebase -X theirs origin main && git push origin main)
